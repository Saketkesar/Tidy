<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC6E5"/>
      <stop offset="0.5" stop-color="#C3B1FF"/>
      <stop offset="1" stop-color="#9ADFF5"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE9F6"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.3" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#6A4FB8" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile">
      <rect x="64" y="64" width="896" height="896" rx="210"/>
    </clipPath>
    <path id="spark" d="M0,-1 Q0,0 1,0 Q0,0 0,1 Q0,0 -1,0 Q0,0 0,-1 Z"/>
  </defs>

  <!-- app tile -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- soft bubbles -->
    <circle cx="190" cy="800" r="120" fill="#FFFFFF" opacity="0.14"/>
    <circle cx="850" cy="820" r="170" fill="#FFFFFF" opacity="0.12"/>
    <circle cx="820" cy="190" r="90" fill="#FFFFFF" opacity="0.14"/>
    <circle cx="150" cy="210" r="60" fill="#FFFFFF" opacity="0.16"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#gloss)"/>
  </g>

  <!-- folder buddy -->
  <g filter="url(#soft)">
    <path d="M342 300 H450 Q480 300 498 328 L520 360 H682 Q792 360 792 470 V670 Q792 780 682 780 H342 Q232 780 232 670 V410 Q232 300 342 300 Z"
          fill="url(#folder)"/>
  </g>
  <!-- folder inner shine -->
  <path d="M300 395 Q300 372 330 372 H470" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

  <!-- eyes -->
  <ellipse cx="416" cy="560" rx="30" ry="36" fill="#5B4B8A"/>
  <ellipse cx="608" cy="560" rx="30" ry="36" fill="#5B4B8A"/>
  <circle cx="426" cy="546" r="11" fill="#FFFFFF"/>
  <circle cx="618" cy="546" r="11" fill="#FFFFFF"/>

  <!-- blush -->
  <ellipse cx="350" cy="615" rx="40" ry="24" fill="#FF9EC7" opacity="0.65"/>
  <ellipse cx="674" cy="615" rx="40" ry="24" fill="#FF9EC7" opacity="0.65"/>

  <!-- smile -->
  <path d="M474 614 Q512 662 550 614" fill="none" stroke="#5B4B8A" stroke-width="16" stroke-linecap="round"/>

  <!-- sparkles -->
  <use href="#spark" transform="translate(790 250) scale(78)" fill="#FFFFFF"/>
  <use href="#spark" transform="translate(236 310) scale(46)" fill="#FFF3B0"/>
  <use href="#spark" transform="translate(842 440) scale(36)" fill="#FFF3B0"/>
  <use href="#spark" transform="translate(700 175) scale(26)" fill="#FFFFFF"/>
  <use href="#spark" transform="translate(190 860) scale(0.01)" fill="#FFFFFF"/>
</svg>
